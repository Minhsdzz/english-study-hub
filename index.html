<!DOCTYPE html>
<html lang="vi">
<head>

        <button class="nav-btn" data-tab="roadmap">🚀 Lộ trình 0 - 6.5</button>
        <button class="nav-btn" data-tab="resources">📚 Kho tài liệu</button>
        <button class="nav-btn" data-tab="vocab">✍️ Sổ từ vựng</button>

      <!-- Đồng hồ bấm giờ học tập -->

        <div id="timer-display" class="timer-display">25:00</div>

          <button class="preset-btn" data-minutes="30">30p</button>
        </div>
        <div class="timer-controls">
          <button id="timer-start" class="btn-primary">Bắt đầu</button>
          <button id="timer-reset" class="btn-secondary">Đặt lại</button>

      </div>
    </aside>

      <header class="top-header">
        <div>

          </div>

      <section id="tab-today" class="tab-section active">

      </section>

      <!-- TAB 2: LỊCH TRÌNH CẢ TUẦN -->
      <section id="tab-weekly" class="tab-section">
        <div id="weekly-schedule-container"></div>
      </section>

      <!-- TAB 3: LỘ TRÌNH 0 - 6.5 IELTS -->
      <section id="tab-roadmap" class="tab-section">
        <div id="roadmap-container" class="roadmap-list"></div>
      </section>

      <!-- TAB 4: KHO TÀI LIỆU -->
      <section id="tab-resources" class="tab-section">
        <div class="filter-bar">
          <input type="text" id="resource-search" placeholder="Tìm nhanh trang web, công cụ luyện nghe, từ điển...">
          <div class="category-filters" id="resource-categories">
            <button class="filter-chip active" data-cat="all">Tất cả</button>
            <button class="filter-chip" data-cat="vocab">Từ vựng & Phát âm</button>
            <button class="filter-chip" data-cat="reading">Đọc & Ngữ pháp</button>
            <button class="filter-chip" data-cat="listening">Nghe & Giao tiếp</button>
            <button class="filter-chip" data-cat="test">Kiểm tra trình độ</button>
          </div>
        </div>
        <div id="resources-container" class="resources-grid"></div>
      </section>

          <form id="vocab-form" class="vocab-card">
            <h3>➕ Thêm từ mới hôm nay (Mục tiêu: 5–10 từ/ngày)</h3>
            <div class="form-group">
              <label>Từ vựng & Từ loại</label>
              <input type="text" id="vocab-word" placeholder="VD: resilient (adj)" required>
            </div>
            <div class="form-group">
              <label>Phiên âm (IPA) & Nghĩa</label>
              <input type="text" id="vocab-meaning" placeholder="VD: /rɪˈzɪliənt/ - Kiên cường, mau phục hồi" required>
            </div>
            <div class="form-group">
              <label>Collocations / Phrasal Verbs / Câu ví dụ</label>
              <textarea id="vocab-example" rows="3" placeholder="Ghi lại cấu trúc từ và câu ví dụ tra từ Longman..."></textarea>
            </div>
            <button type="submit" class="btn-primary">Lưu vào sổ từ vựng</button>
          </form>

            <div class="vocab-list-header">

            <div id="vocab-list" class="vocab-items"></div>

        </div>
      </section>
    </main>

      },
      {
        stage: "Giai Đoạn 3",
        title: "Luyện Thi Chuyên Sâu IELTS",
        target: "5.0 - 6.5 IELTS",
        mainGoal: "Làm quen với định dạng đề thi IELTS (Listening, Reading, Writing, Speaking), phát triển chiến thuật làm từng dạng bài, tối ưu hóa thời gian và tiêu chí chấm điểm IELTS.",
        tools: [
          { group: "Speaking & Phản xạ", items: ["Speech Topic Generator"] },
          { group: "Luyện đề & Đánh giá", items: ["Test English", "Use English"] }
        ],
        actions: [
          "Listening: Chuyển từ chép chính tả sang luyện nghe các dạng bài IELTS Listening (Section 1-4), chú trọng Note-taking và nhận diện Synonyms/Paraphrasing.",
          "Reading: Luyện kỹ thuật Skimming, Scanning, Keyword Technique cho các dạng bài True/False/Not Given, Matching Headings, Multiple Choice.",
          "Writing: Học cấu trúc bài Task 1 (Line graph, Bar chart, Pie chart, Table, Process, Map) và Task 2 (Opinion, Discussion, Problem-Solution). Chú trọng Cohesive devices và từ vựng Academic.",
          "Speaking: Mở rộng câu trả lời Part 1, cấu trúc bài Part 2 (câu chuyện 2 phút) và tư duy phân tích Part 3. Luyện nói tự do trên Speech Topic Generator.",
          "Luyện đề & Đánh giá: Định kỳ làm đề thi mô phỏng, bấm giờ và tính điểm trên các nền tảng kiểm tra trực tuyến."
        ]
      }
    ];

    // ================= 4. ĐỒNG HỒ BẤM GIỜ (TIMER) =================
    let timerInterval = null;
    let remainingSeconds = 25 * 60;
    let isRunning = false;

    const timerDisplay = document.getElementById('timer-display');
    const startBtn = document.getElementById('timer-start');
    const resetBtn = document.getElementById('timer-reset');
    const presetBtns = document.querySelectorAll('.preset-btn');

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateTimerUI() {
      timerDisplay.textContent = formatTime(remainingSeconds);
    }

    function setTimerMinutes(minutes, autoStart = false) {
      clearInterval(timerInterval);
      isRunning = false;
      remainingSeconds = minutes * 60;
      startBtn.textContent = 'Bắt đầu';
      updateTimerUI();
      if (autoStart) toggleTimer();
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        startBtn.textContent = 'Tiếp tục';
      } else {
        isRunning = true;
        startBtn.textContent = 'Tạm dừng';
        timerInterval = setInterval(() => {
          if (remainingSeconds > 0) {
            remainingSeconds--;
            updateTimerUI();
          } else {
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.textContent = 'Bắt đầu';
            alert('🎉 Đã hết giờ học phiên này! Hãy nghỉ ngơi một chút nhé.');
          }
        }, 1000);
      }
    }

    startBtn.addEventListener('click', toggleTimer);
    resetBtn.addEventListener('click', () => setTimerMinutes(25, false));
    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const mins = parseInt(btn.getAttribute('data-minutes'), 10);
        setTimerMinutes(mins, false);
      });
    });

    // ================= 5. LƯU TIẾN ĐỘ & LỊCH HỌC HÔM NAY =================
    const DAY_NAMES = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];

    function getTodayKey() {
      const now = new Date();
      return `study_tasks_${now.getFullYear()}_${now.getMonth() + 1}_${now.getDate()}`;
    }

    function getCompletedTasks() {
      const raw = localStorage.getItem(getTodayKey());
      return raw ? JSON.parse(raw) : [];
    }

    function toggleTaskCompletion(taskId, isChecked) {
      let completed = getCompletedTasks();
      if (isChecked && !completed.includes(taskId)) {
        completed.push(taskId);
      } else if (!isChecked) {
        completed = completed.filter(id => id !== taskId);
      }
      localStorage.setItem(getTodayKey(), JSON.stringify(completed));
      updateProgressBar();
    }

    function updateProgressBar() {
      const checkboxes = document.querySelectorAll('#today-schedule-container input[type="checkbox"]');
      const total = checkboxes.length;
      if (total === 0) return;

      let checkedCount = 0;
      checkboxes.forEach(cb => { if (cb.checked) checkedCount++; });

      const percent = Math.round((checkedCount / total) * 100);
      document.getElementById('today-progress-text').textContent = `${percent}% (${checkedCount}/${total})`;
      document.getElementById('today-progress-fill').style.width = `${percent}%`;
    }

    function renderTodaySchedule() {
      const now = new Date();
      const dayIndex = now.getDay();
      const todaySchedule = WEEKLY_SCHEDULE.find(item => item.days.includes(dayIndex)) || WEEKLY_SCHEDULE[0];

      const dateStr = now.toLocaleDateString('vi-VN');
      document.getElementById('current-date-title').textContent = `${DAY_NAMES[dayIndex]} (${dateStr})`;
      document.getElementById('current-day-focus').textContent = `Trọng tâm: ${todaySchedule.focus}`;

      const completedTasks = getCompletedTasks();
      const container = document.getElementById('today-schedule-container');
      container.innerHTML = '';

      todaySchedule.sessions.forEach(session => {
        const card = document.createElement('div');
        card.className = 'session-card';

        const tasksHTML = session.tasks.map(task => {
          const isDone = completedTasks.includes(task.id);
          const linksHTML = task.links.map(l => 
            `<a href="${l.url}" target="_blank" class="link-btn">🔗 ${l.label}</a>`
          ).join('');

          return `
            <div class="task-item ${isDone ? 'completed' : ''}" id="item-${task.id}">
              <div class="task-top">
                <label class="task-label">
                  <input type="checkbox" data-task-id="${task.id}" ${isDone ? 'checked' : ''}>
                  <span class="task-title">${task.name}</span>
                </label>
              </div>
              <p class="task-detail">${task.detail}</p>
              <div class="task-actions">
                <button class="btn-secondary start-task-timer" data-duration="${task.duration}">
                  ⏱️ Bấm giờ ${task.duration}p
                </button>
                ${linksHTML}
              </div>
            </div>
          `;
        }).join('');

        card.innerHTML = `
          <div class="session-header">
            <div>
              <span class="badge">${session.period}</span>
              <h3 style="margin-top: 6px;">${session.title}</h3>
            </div>
            <small style="color: var(--text-secondary); font-weight: 600;">🎯 ${session.goal}</small>
          </div>
          <div class="session-tasks">${tasksHTML}</div>
        `;
        container.appendChild(card);
      });

      container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        cb.addEventListener('change', (e) => {
          const taskId = e.target.getAttribute('data-task-id');
          document.getElementById(`item-${taskId}`).classList.toggle('completed', e.target.checked);
          toggleTaskCompletion(taskId, e.target.checked);
        });
      });

      container.querySelectorAll('.start-task-timer').forEach(btn => {
        btn.addEventListener('click', () => {
          const mins = parseInt(btn.getAttribute('data-duration'), 10);
          setTimerMinutes(mins, true);
        });
      });

      updateProgressBar();
    }

    // ================= 6. SỔ TỪ VỰNG =================
    const VOCAB_STORAGE_KEY = 'english_hub_vocab_list';

    function getVocabList() {
      const raw = localStorage.getItem(VOCAB_STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }

    function saveVocabList(list) {
      localStorage.setItem(VOCAB_STORAGE_KEY, JSON.stringify(list));
    }

    function renderVocabList() {
      const list = getVocabList();
      const container = document.getElementById('vocab-list');
      document.getElementById('vocab-count').textContent = list.length;

      if (list.length === 0) {
        container.innerHTML = `<p style="color: var(--text-secondary);">Chưa có từ vựng nào. Hãy tra từ điển Longman và lưu 5–10 từ mỗi sáng nhé!</p>`;
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="vocab-item">
          <div>
            <h4 style="color: var(--accent);">${item.word}</h4>
            <p style="font-weight: 500; margin: 4px 0;">${item.meaning}</p>
            ${item.example ? `<p style="font-size: 0.88rem; color: var(--text-secondary);">💡 ${item.example}</p>` : ''}
            <small style="color: var(--text-secondary); font-size: 0.75rem;">Ngày lưu: ${item.date}</small>
          </div>
          <button class="delete-vocab-btn" data-id="${item.id}">🗑️ Xóa</button>
        </div>
      `).join('');

      container.querySelectorAll('.delete-vocab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          saveVocabList(getVocabList().filter(v => v.id !== id));
          renderVocabList();
        });
      });
    }

    document.getElementById('vocab-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const word = document.getElementById('vocab-word').value.trim();
      const meaning = document.getElementById('vocab-meaning').value.trim();
      const example = document.getElementById('vocab-example').value.trim();
      if (!word || !meaning) return;

      const list = getVocabList();
      list.unshift({
        id: Date.now().toString(),
        word,
        meaning,
        example,
        date: new Date().toLocaleDateString('vi-VN')
      });
      saveVocabList(list);
      e.target.reset();
      renderVocabList();
    });

    // ================= 7. ĐIỀU HƯỚNG TAB, LỘ TRÌNH, KHO TÀI LIỆU & DARK MODE =================
    const navBtns = document.querySelectorAll('.nav-btn');
    const tabSections = document.querySelectorAll('.tab-section');

    navBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        navBtns.forEach(b => b.classList.remove('active'));
        tabSections.forEach(s => s.classList.remove('active'));
        btn.classList.add('active');
        const targetTab = btn.getAttribute('data-tab');
        document.getElementById(`tab-${targetTab}`).classList.add('active');
      });
    });

    function renderWeeklySchedule() {
      const container = document.getElementById('weekly-schedule-container');
      container.innerHTML = WEEKLY_SCHEDULE.map(group => `
        <div class="weekly-block">
          <div class="roadmap-header">
            <h3>📅 ${group.dayLabel}</h3>
            <span class="badge">${group.focus}</span>
          </div>
          <div class="schedule-grid" style="margin-top: 14px;">
            ${group.sessions.map(sec => `
              <div style="border: 1px solid var(--border); border-radius: 10px; padding: 14px;">
                <strong>⏰ ${sec.period} —${sec.title}</strong>
                <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px;">Mục tiêu: ${sec.goal}</p>
                <ul style="padding-left: 18px; font-size: 0.9rem;">
                  ${sec.tasks.map(t => `<li style="margin-bottom: 6px;"><strong>${t.name}:</strong> ${t.detail}</li>`).join('')}
                </ul>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function renderRoadmap() {
      const container = document.getElementById('roadmap-container');
      container.innerHTML = IELTS_ROADMAP.map(stage => `
        <div class="roadmap-card">
          <div class="roadmap-header">
            <h3>🚀 ${stage.stage}: ${stage.title}</h3>
            <span class="badge">Mục tiêu: ${stage.target}</span>
          </div>
          <p style="margin-bottom: 12px;"><strong>🎯 Trọng tâm:</strong> ${stage.mainGoal}</p>
          <div style="margin-bottom: 12px;">
            <strong>🛠️ Công cụ sử dụng:</strong>
            <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px;">
              ${stage.tools.map(t => `<span class="badge" style="background: var(--bg-main); color: var(--text-primary); border: 1px solid var(--border);"><b>${t.group}:</b>${t.items.join(', ')}</span>`).join('')}
            </div>
          </div>
          <strong>📌 Nội dung & Cách thực hiện:</strong>
          <ul class="roadmap-actions-list">
            ${stage.actions.map(act => `<li>${act}</li>`).join('')}
          </ul>
        </div>
      `).join('');
    }

    let currentCategory = 'all';
    function renderResources() {
      const keyword = document.getElementById('resource-search').value.toLowerCase().trim();
      const container = document.getElementById('resources-container');

      const filtered = STUDY_RESOURCES.filter(item => {
        const matchCat = currentCategory === 'all' || item.category === currentCategory;
        const matchKeyword = item.title.toLowerCase().includes(keyword) || item.description.toLowerCase().includes(keyword);
        return matchCat && matchKeyword;
      });

      container.innerHTML = filtered.map(res => `
        <div class="resource-card">
          <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <span class="badge">${res.tag}</span>
              <small style="color: var(--text-secondary);">${res.categoryName}</small>
            </div>
            <h3 style="font-size: 1.08rem; margin-bottom: 6px;">${res.title}</h3>
            <p style="font-size: 0.88rem; color: var(--text-secondary);">${res.description}</p>
          </div>
          <a href="${res.url}" target="_blank" class="btn-primary" style="justify-content: center;">Truy cập trang web ↗</a>
        </div>
      `).join('');
    }

    document.getElementById('resource-search').addEventListener('input', renderResources);
    document.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentCategory = chip.getAttribute('data-cat');
        renderResources();
      });
    });

    const themeBtn = document.getElementById('theme-toggle');
    if (localStorage.getItem('study_hub_theme') === 'dark') {
      document.body.classList.add('dark-mode');
      themeBtn.textContent = '☀️';
    }
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('study_hub_theme', isDark ? 'dark' : 'light');
      themeBtn.textContent = isDark ? '☀️' : '🌙';
    });

    // Khởi tạo ngay khi mở trang
    updateTimerUI();
    renderTodaySchedule();
    renderWeeklySchedule();
    renderRoadmap();
    renderResources();
    renderVocabList();
  </script>
</body>
</html>
